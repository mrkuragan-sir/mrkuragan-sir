name: Build Profile SVGs

on:
  push:
    branches: [main]
    paths: ["scripts/gen_assets.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/gen_assets.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A assets
          git commit -m "rebuild profile svgs" || exit 0
          git push
